<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
        }
        canvas {
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        // Create the pong paddle
        const paddleWidth = 10;
        const paddleHeight = 100;
        const player = {
            x: 0,
            y: (canvas.height - paddleHeight) / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: 'WHITE',
            dy: 5
        };

        // Create the pong ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 10,
            speed: 4,
            dx: 4,
            dy: 4
        };

        // Draw the rectangle
        function drawRect(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        // Draw the circle
        function drawCircle(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
        }

        // Move the paddle
        function movePaddle() {
            document.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowUp' && player.y > 0) {
                    player.y -= player.dy;
                } else if (event.key === 'ArrowDown' && player.y < canvas.height - player.height) {
                    player.y += player.dy;
                }
            });
        }

        // Update the canvas
        function update() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw everything
            drawRect(player.x, player.y, player.width, player.height, player.color);
            drawCircle(ball.x, ball.y, ball.size, 'WHITE');
            // Move the ball
            ball.x += ball.dx;
            ball.y += ball.dy;
            // Ball collision with top and bottom
            if (ball.y + ball.size > canvas.height || ball.y - ball.size < 0) {
                ball.dy *= -1;
            }
            // Ball collision with paddle
            if (ball.x < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height) {
                ball.dx *= -1;
            }
            // Reset ball if it goes off screen
            if (ball.x + ball.size < 0) {
                resetBall();
            }
        }

        // Reset ball to the center
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = 4;
            ball.dy = 4;
        }

        function gameLoop() {
            movePaddle();
            update();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
